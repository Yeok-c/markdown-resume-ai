<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Resume AI - Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .setting {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    button:hover {
      background: #0052a3;
    }
    #save-status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .success {
      background: #d4edda;
      color: #155724;
    }
  </style>
</head>
<body>
  <h1>Resume AI - Extension Settings</h1>
  
  <div class="setting">
    <label for="api-endpoint">API Endpoint:</label>
    <input type="text" id="api-endpoint" placeholder="http://localhost:3001/api/job-description">
  </div>
  
  <div class="setting">
    <label for="api-key">API Key (optional):</label>
    <input type="text" id="api-key" placeholder="Your API key">
  </div>
  
  <button id="save-btn">Save Settings</button>
  
  <div id="save-status"></div>
  
  <script src="options.js"></script>
</body>
</html>
